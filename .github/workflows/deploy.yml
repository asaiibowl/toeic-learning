name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# gh-pages ブランチへの書き込みに必要な権限設定
permissions:
  contents: write

# 同時に1つのデプロイだけ実行（並行デプロイを防ぐ）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: データ検証
        run: npm run validate-data

      - name: ESLint
        run: npm run lint

      - name: TypeScript 型検査
        run: npx tsc --noEmit --incremental false

      - name: ユニットテスト
        run: npm test

      - name: ビルド
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: gh-pages ブランチへデプロイ
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
