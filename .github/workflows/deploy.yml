name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Actions を配信元とする Pages デプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に1つのデプロイだけ実行（並行デプロイを防ぐ）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pages 設定の取得
        id: pages
        uses: actions/configure-pages@v5

      - name: 依存関係のインストール
        run: npm ci

      - name: データ検証
        run: npm run validate-data

      - name: ESLint
        run: npm run lint

      - name: TypeScript 型検査
        run: npx tsc --noEmit --incremental false

      - name: ユニットテスト
        run: npm test

      - name: ビルド
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub 側の反映が 10 分を超えることがあるため上限を 30 分に延長
          timeout: 1800000
